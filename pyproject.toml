[project]
name = "pre-commit-hooks"
version = "0.1.0"
description = "My pre-commit hooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
check-symlinks-outside-repo = "pre_commit_hooks.check_symlinks_outside_repo:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pre_commit_hooks"
module-root = ""
