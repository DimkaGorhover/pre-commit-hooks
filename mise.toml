#:schema https://mise.en.dev/schema/mise.json

[settings]
minimum_release_age = "7d"

[env]
NO_MKDOCS_2_WARNING = "1"  # mkdocs is pinned <2 in pyproject.toml

[tools]
checkov = "latest"
gitleaks = "latest"
prek = "latest"
ruff = "latest"
ryl = "latest"
shellcheck = "latest"
shfmt = "latest"  # required by the mdformat-shfmt hook plugin
ty = "latest"
uv = "latest"

[tool_alias]
ryl = "github:owenlamont/ryl"

[tasks.pre-commit]
description = "run pre-commit hooks on all files"
dir = "{{config_root}}"
run = "prek run --all-files"

[tasks."docs:build"]
description = "build the mkdocs site into site/"
dir = "{{config_root}}"
run = "uv run --only-group docs mkdocs build --strict"

[tasks."docs:serve"]
description = "serve the mkdocs site with live reload"
dir = "{{config_root}}"
run = "uv run --only-group docs mkdocs serve"

[tasks."release:bump"]
description = "set the release version in pyproject.toml, uv.lock and the docs rev: pins"
dir = "{{config_root}}"
shell = "bash -c"
usage = 'arg "<version>" help="X.Y.Z, without the v prefix"'
run = '''
set -euo pipefail
v="${usage_version}"
[[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got: $v" >&2; exit 1; }
uv version "$v"
# only pins of this repo; docs/superpowers holds historical plans
git ls-files -z README.md 'docs/*.md' ':!docs/superpowers' |
  xargs -0 perl -0pi -e 's{(repo: https://github\.com/DimkaGorhover/pre-commit-hooks\n\s+rev: )[^\n]*}{${1}v'"$v"'}g'
'''
