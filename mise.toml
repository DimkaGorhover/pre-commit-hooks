#:schema https://mise.en.dev/schema/mise.json

[settings]
minimum_release_age = "7d"

[env]
NO_MKDOCS_2_WARNING = "1"  # mkdocs is pinned <2 in pyproject.toml

[tools]
checkov = "latest"
gitleaks = "latest"
prek = "latest"
ruff = "latest"
ryl = "latest"
shellcheck = "latest"
shfmt = "latest"  # required by the mdformat-shfmt hook plugin
ty = "latest"
uv = "latest"

[tool_alias]
ryl = "github:owenlamont/ryl"

[tasks.pre-commit]
description = "run pre-commit hooks on all files"
dir = "{{config_root}}"
run = "prek run --all-files"

[tasks."docs:build"]
description = "build the mkdocs site into site/"
dir = "{{config_root}}"
run = "uv run --only-group docs mkdocs build --strict"

[tasks."docs:serve"]
description = "serve the mkdocs site with live reload"
dir = "{{config_root}}"
run = "uv run --only-group docs mkdocs serve"
