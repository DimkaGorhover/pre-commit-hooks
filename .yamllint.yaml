# yaml-language-server: $schema=https://json.schemastore.org/yamllint.json

extends: default

# For all rules
ignore: |
  .idea/
  .git/
  .build/
  venv/
  .venv/
  .teamcity/
  .cache/
  __snapshot__
  .tmp/
  hack/.build/

rules:
  line-length:
    max: 120
    level: warning

  document-start:
    present: false
    level: warning
    ignore:
      - .gitlab-ci.yml
      - .pre-commit-config.yaml

  indentation:
    spaces: 2
    level: error

  comments:
    require-starting-space: true
    ignore-shebangs: true
    min-spaces-from-content: 1
    level: error

  empty-lines:
    max: 1
    max-start: 0
    max-end: 0
    level: error

  colons:
    max-spaces-before: 0
    max-spaces-after: 1
    level: error

  commas:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
    level: error

  braces:
    # forbid: non-empty
    min-spaces-inside: 1
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
    level: error

  brackets:
    # forbid: non-empty
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
    level: error

  hyphens:
    max-spaces-after: 1
    level: error
